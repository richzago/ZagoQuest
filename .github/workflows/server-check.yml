name: Server build and regression tests

on:
  push:
    branches: [fix/backend-xp-progression, fix/backend-inventory-economy, fix/backend-monster-spawns, fix/backend-scheduled-tasks]
  pull_request:
    branches: [refactor/backend-stabilization, fix/backend-xp-progression, fix/backend-inventory-economy, fix/backend-monster-spawns]
    paths:
      - "server/**"
      - ".github/workflows/server-check.yml"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
